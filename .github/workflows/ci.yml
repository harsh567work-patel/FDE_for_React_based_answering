name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Lint Verification
        run: |
          python -m py_compile main.py server.py knowledge_base/vector_store.py knowledge_base/devdocs_loader.py
          echo "All Python modules compiled successfully."

      - name: Verify Web Assets
        run: |
          test -f static/index.html && echo "static/index.html verified"
          test -f static/styles.css && echo "static/styles.css verified"
          test -f static/app.js     && echo "static/app.js verified"
