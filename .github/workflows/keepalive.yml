name: LiveAlways - Keep Alive Ping

on:
  schedule:
    # Runs every 14 minutes to prevent free tier services (e.g. Render, Railway, HuggingFace) from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    name: Ping Deployed Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Server Status Endpoint
        run: |
          TARGET_URL="${{ secrets.LIVE_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "::notice ::No LIVE_APP_URL secret set. Set repository secret LIVE_APP_URL to your deployment URL (e.g. https://your-app.onrender.com) to enable live keepalive pings."
            exit 0
          fi

          echo "Pinging health endpoint at ${TARGET_URL}/api/status..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" "${TARGET_URL}/api/status" --max-time 30)
          
          echo "HTTP Status Code: $HTTP_STATUS"
          cat response.txt || true
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Service is healthy and live!"
          else
            echo "Warning: Received unexpected status code $HTTP_STATUS"
          fi
